version: '3.9'

services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - stocklens_internal

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: development
    container_name: stocklens-api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-stocklens}:${POSTGRES_PASSWORD:-stocklens_password}@db:5432/${POSTGRES_DB:-stocklens_db}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:80,http://localhost}
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ../backend/app:/app/app:ro    # hot-reload via uvicorn --reload
      - ../backend/db:/app/db:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - stocklens_internal

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: development
    container_name: stocklens-frontend
    environment:
      NODE_ENV: development
      API_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost}
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules    # persistent node_modules
      - frontend_next:/app/.next                   # persistent build cache
    depends_on:
      - api
    networks:
      - stocklens_internal

  db:
    image: postgres:15-alpine
    container_name: stocklens-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stocklens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stocklens_password}
      POSTGRES_DB: ${POSTGRES_DB:-stocklens_db}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stocklens_internal

  redis:
    image: redis:7-alpine
    container_name: stocklens-cache
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no   # no persistence in dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stocklens_internal

  ollama:
    image: ollama/ollama:latest
    container_name: stocklens-llm
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=5
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=10m
    networks:
      - stocklens_internal

  prometheus:
    image: prom/prometheus:v2.50.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - stocklens_internal

  grafana:
    image: grafana/grafana:10.3.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - stocklens_internal

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - stocklens_internal

  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitoring/loki/promtail-config.yml:/etc/promtail/config.yml:ro
    depends_on:
      - loki
    networks:
      - stocklens_internal

volumes:
  pg_data:
  ollama_models:
  prometheus_data:
  grafana_data:
  loki_data:
  frontend_node_modules:
  frontend_next:

networks:
  stocklens_internal:
    driver: bridge
