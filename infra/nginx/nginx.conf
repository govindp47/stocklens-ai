user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    # ── Upstream definitions ─────────────────────────────────
    upstream api_upstream {
        server api:8000;
        keepalive 16;
    }

    upstream frontend_upstream {
        server frontend:3000;
        keepalive 8;
    }

    # ── Rate limiting zones ───────────────────────────────────
    # api_analyze: stricter zone for the expensive analysis endpoint
    limit_req_zone  $binary_remote_addr zone=api_analyze:10m rate=20r/m;
    # api_general: relaxed zone for all other API routes
    limit_req_zone  $binary_remote_addr zone=api_general:10m rate=120r/m;
    # conn_per_ip: concurrent connection limit per IP
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # ── HTTP server — development (no TLS redirect) ──────────
    server {
        listen 80;
        server_name _;

        # ── Request size and timeout guards ──────────────────
        client_max_body_size   1k;
        client_body_timeout    10s;
        client_header_timeout  10s;
        send_timeout           10s;

        # ── Security headers ──────────────────────────────────
        # HSTS — enable once TLS is provisioned (T-059)
        add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options     "nosniff" always;
        add_header X-Frame-Options            "DENY" always;
        add_header X-XSS-Protection           "1; mode=block" always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-src 'none'; object-src 'none';" always;

        # ── Block Prometheus metrics endpoint ─────────────────
        location /metrics {
            deny all;
            return 404;
        }

        # ── Health endpoint — internal networks only ──────────
        location /health {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;

            proxy_pass               http://api_upstream/health;
            proxy_set_header         Host              $host;
            proxy_set_header         X-Real-IP         $remote_addr;
            proxy_set_header         X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header         X-Forwarded-Proto $scheme;
            proxy_http_version       1.1;
            proxy_set_header         Connection "";
        }

        # ── SSE stream ────────────────────────────────────────────────
        location /api/v1/analyze/stream/ {
            limit_req  zone=api_analyze burst=5 nodelay;
            limit_conn conn_per_ip 10;

            proxy_buffering         off;
            proxy_cache             off;
            proxy_read_timeout      650s;   # > 600s WATCHDOG_TIMEOUT_MS
            proxy_connect_timeout   10s;
            send_timeout            650s;   # ✅ override the global 10s — SSE needs this
            add_header              X-Accel-Buffering no always;
            add_header              Cache-Control "no-cache" always;

            proxy_pass              http://api_upstream;
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_http_version      1.1;
            proxy_set_header        Connection "";
        }

        # ── SSE: /api/v1/analyze — rate limited, buffering disabled ──
        location /api/v1/analyze {
            limit_req  zone=api_analyze burst=5 nodelay;
            limit_conn conn_per_ip 10;

            proxy_buffering          off;
            proxy_cache              off;
            proxy_read_timeout       120s;

            proxy_pass               http://api_upstream;
            proxy_set_header         Host              $host;
            proxy_set_header         X-Real-IP         $remote_addr;
            proxy_set_header         X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header         X-Forwarded-Proto $scheme;
            proxy_http_version       1.1;
            proxy_set_header         Connection "";
        }

        # ── General API routes — rate limited ─────────────────
        location /api/ {
            limit_req  zone=api_general burst=20 nodelay;
            limit_conn conn_per_ip 20;

            proxy_pass               http://api_upstream;
            proxy_set_header         Host              $host;
            proxy_set_header         X-Real-IP         $remote_addr;
            proxy_set_header         X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header         X-Forwarded-Proto $scheme;
            proxy_http_version       1.1;
            proxy_set_header         Connection "";
            proxy_read_timeout       30s;
        }

        # ── Next.js static assets ─────────────────────────────
        location /_next/static/ {
            proxy_pass http://frontend_upstream;
            expires    1y;
            add_header Cache-Control "public, immutable";
        }

        # ── Frontend catch-all ────────────────────────────────
        location / {
            proxy_pass               http://frontend_upstream;
            proxy_set_header         Host              $host;
            proxy_set_header         X-Real-IP         $remote_addr;
            proxy_set_header         X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_http_version       1.1;
            proxy_set_header         Connection "";
        }
    }
}
