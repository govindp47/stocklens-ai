user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    # ── Upstream definitions ─────────────────────────────────
    upstream api_upstream {
        server api:8000;
        keepalive 16;
    }

    upstream frontend_upstream {
        server frontend:3000;
        keepalive 8;
    }

    # ── HTTP server — development (no TLS redirect) ──────────
    server {
        listen 80;
        server_name _;

        # ── Security headers (dev — no HSTS) ─────────────────
        add_header X-Content-Type-Options  "nosniff" always;
        add_header X-Frame-Options         "DENY" always;
        add_header X-XSS-Protection        "1; mode=block" always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-src 'none'; object-src 'none';" always;

        # ── Block internal endpoints ──────────────────────────
        location /metrics {
            deny all;
            return 404;
        }

        # ── Health endpoint ───────────────────────────────────
        location /health {
            proxy_pass               http://api_upstream/health;
            proxy_set_header         Host              $host;
            proxy_set_header         X-Real-IP         $remote_addr;
            proxy_set_header         X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header         X-Forwarded-Proto $scheme;
            proxy_http_version       1.1;
            proxy_set_header         Connection "";
        }

        # ── SSE: /api/v1/analyze — buffering disabled ─────────
        location /api/v1/analyze {
            proxy_buffering          off;
            proxy_cache              off;
            proxy_read_timeout       120s;

            proxy_pass               http://api_upstream;
            proxy_set_header         Host              $host;
            proxy_set_header         X-Real-IP         $remote_addr;
            proxy_set_header         X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header         X-Forwarded-Proto $scheme;
            proxy_http_version       1.1;
            proxy_set_header         Connection "";
        }

        # ── General API routes ────────────────────────────────
        location /api/ {
            proxy_pass               http://api_upstream;
            proxy_set_header         Host              $host;
            proxy_set_header         X-Real-IP         $remote_addr;
            proxy_set_header         X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header         X-Forwarded-Proto $scheme;
            proxy_http_version       1.1;
            proxy_set_header         Connection "";
            proxy_read_timeout       30s;
        }

        # ── Next.js static assets ─────────────────────────────
        location /_next/static/ {
            proxy_pass http://frontend_upstream;
            expires    1y;
            add_header Cache-Control "public, immutable";
        }

        # ── Frontend catch-all ────────────────────────────────
        location / {
            proxy_pass               http://frontend_upstream;
            proxy_set_header         Host              $host;
            proxy_set_header         X-Real-IP         $remote_addr;
            proxy_set_header         X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_http_version       1.1;
            proxy_set_header         Connection "";
        }

        client_max_body_size   1k;
        client_body_timeout    10s;
        client_header_timeout  10s;
        send_timeout           10s;
    }
}
