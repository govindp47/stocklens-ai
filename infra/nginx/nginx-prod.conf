user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;   # hide Nginx version

    # ── Rate limiting zones ───────────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr zone=api_analyze:10m rate=20r/m;
    limit_req_zone  $binary_remote_addr zone=api_general:10m rate=120r/m;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # ── Upstream definitions ──────────────────────────────────────────────────
    upstream api_upstream {
        server api:8000;
        keepalive 16;
    }

    upstream frontend_upstream {
        server frontend:3000;
        keepalive 8;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Let's Encrypt ACME challenge (needed for certificate renewal)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS server ──────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name stocklens.example.com;

        # ── TLS certificates (provisioned by provision-tls.sh) ────────────────
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # ── TLS hardening ─────────────────────────────────────────────────────
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;
        ssl_session_tickets       off;

        # OCSP stapling
        ssl_stapling        on;
        ssl_stapling_verify on;
        resolver            1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout    5s;

        # ── Security headers ──────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-src 'none'; object-src 'none';" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

        # ── Block internal-only endpoints ─────────────────────────────────────
        location /metrics {
            deny all;
            return 404;
        }

        location /health {
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            deny all;
            proxy_pass http://api_upstream/health;
        }

        # ── API routes ────────────────────────────────────────────────────────
        location /api/v1/analyze {
            limit_req  zone=api_analyze burst=5 nodelay;
            limit_conn conn_per_ip 10;

            # SSE — must disable buffering for real-time event delivery
            proxy_buffering          off;
            proxy_cache              off;
            proxy_read_timeout       120s;   # > pipeline_timeout(90s) + buffer

            proxy_pass               http://api_upstream;
            proxy_set_header         Host              $host;
            proxy_set_header         X-Real-IP         $remote_addr;
            proxy_set_header         X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header         X-Forwarded-Proto $scheme;
            proxy_http_version       1.1;
            proxy_set_header         Connection "";    # keepalive
        }

        location /api/ {
            limit_req  zone=api_general burst=20 nodelay;
            limit_conn conn_per_ip 20;

            proxy_pass               http://api_upstream;
            proxy_set_header         Host              $host;
            proxy_set_header         X-Real-IP         $remote_addr;
            proxy_set_header         X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header         X-Forwarded-Proto $scheme;
            proxy_http_version       1.1;
            proxy_set_header         Connection "";
            proxy_read_timeout       30s;
        }

        # ── Frontend static assets (long-lived cache) ─────────────────────────
        location /_next/static/ {
            proxy_pass http://frontend_upstream;
            expires    1y;
            add_header Cache-Control "public, immutable";
        }

        # ── Frontend catch-all ────────────────────────────────────────────────
        location / {
            proxy_pass               http://frontend_upstream;
            proxy_set_header         Host              $host;
            proxy_set_header         X-Real-IP         $remote_addr;
            proxy_set_header         X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_http_version       1.1;
            proxy_set_header         Connection "";
        }

        # ── Request size and timeout limits ───────────────────────────────────
        client_max_body_size   1k;
        client_body_timeout    10s;
        client_header_timeout  10s;
        send_timeout           10s;
    }
}
