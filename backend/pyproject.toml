[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project]
name = "stocklens-ai"
version = "1.0.0"
description = "StockLens AI — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.121.0",
    "starlette==0.49.3",
    "uvicorn[standard]==0.29.0",
    "uvloop==0.19.0",
    "httptools==0.6.1",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "asyncpg==0.29.0",
    "redis==5.0.4",
    "aioredis==2.0.1",
    "alembic==1.13.1",
    "sqlalchemy==2.0.30",
    "greenlet==3.3.2",
    "yfinance==0.2.40",
    "feedparser==6.0.11",
    "httpx==0.27.0",
    "jinja2==3.1.6",
    "prometheus-fastapi-instrumentator==7.0.0",
    "structlog==24.1.0",
    "python-multipart==0.0.22",
    "mmh3==4.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "types-redis==4.6.0.20240425",
    "httpx==0.27.0",
    "anyio==4.3.0",
    "faker==25.2.0",
    "factory-boy==3.3.0",
    "fakeredis[aioredis]==2.21.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: marks tests as unit tests (no external services)",
    "integration: marks tests as integration tests (requires DB + Redis)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "PT", "RUF"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # assert is idiomatic in pytest test functions

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "app/prompts/*"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
