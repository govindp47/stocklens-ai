# Alembic configuration for StockLens AI
# async SQLAlchemy + asyncpg dialect

[alembic]
# Path to the migration scripts directory, relative to this file
script_location = %(here)s

# Filename pattern for migration scripts
file_template = %%(rev)s_%%(slug)s

# sys.path modification for importing app modules
prepend_sys_path = ..

# The database URL is injected in db/env.py from app settings.
# This value is a placeholder; env.py overrides it at runtime.
sqlalchemy.url = postgresql+asyncpg://stocklens:password@localhost:5432/stocklens

[post_write_hooks]
# No post-write hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
